name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches manifest version
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('extension/manifest.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match the extension manifest version.');
          }
          JS
      - run: npm ci
      - run: npm run package
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --verify-tag \
            --title "Bitbucket PR Description $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file docs/RELEASE_NOTES.md

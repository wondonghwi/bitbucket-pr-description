name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare version or resume an unfinished release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release.js
      - name: Install locked dependencies
        if: steps.prepare.outputs.mode != 'skip'
        run: pnpm install --frozen-lockfile
      - name: Format updated version files
        if: steps.prepare.outputs.mode == 'bump'
        run: pnpm exec prettier --write package.json extension/manifest.json
      - name: Validate and package the candidate version
        if: steps.prepare.outputs.mode != 'skip'
        run: pnpm package
      - name: Publish version commit and tag together
        if: steps.prepare.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json extension/manifest.json
          git commit -m "배포: v${VERSION} 버전 자동 증가"
          git tag -a "v${VERSION}" -m "Bitbucket PR Description v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"
      - name: Publish downloadable release
        if: steps.prepare.outputs.mode != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          EXISTING_DRAFT: ${{ steps.prepare.outputs.draft }}
        run: |
          if [ "$EXISTING_DRAFT" = true ]; then
            gh release upload "v${VERSION}" release/*.zip --clobber
            gh release edit "v${VERSION}" --draft=false --latest
          else
            gh release create "v${VERSION}" release/*.zip \
              --verify-tag --latest \
              --title "Bitbucket PR Description v${VERSION}" \
              --generate-notes
          fi
